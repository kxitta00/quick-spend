<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickSpend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <h1 class="header-title">ภาพรวม</h1>
    <time class="header-date" id="current-date">พุธ 21 ต.ค. 2569</time>
  </header>
  <main>
    <!-- PAGE1 -->
    <section id="view-overview">
      <!-- HERO CARD -->
      <div class="card card-hero">
        <span class="hero-title">ยอดเงินคงเหลือ</span>
        <h2 class="hero-amount" id="balance-amount">฿18,260.00</h2>
        <p class="hero-sub" id="balance-subtitle">รายรับ ฿32,000 - รายจ่าย฿13,740</p>
      </div>
      <!-- ROW CARD -->
      <div class="card-row">
        <!-- Monthly CARD -->
        <div class="card">
          <div class="budget">
            <span class="budget-title">ใช้ไปเดือนนี้</span>
            <span class="budget-percent" id="budget-percent">62%</span>
          </div>
          <div class="budget-amount">
            <span class="budget-spend" id="monthly-expense-amount">฿7,420</span>
            <span class="budget-monthly" id="monthly-budget-amount">/฿12,000</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="budget-progress-fill"></div>
          </div>
          <span class="remaining-text" id="budget-remaining">เหลือ ฿4,580</span>
        </div>
        <!-- Today CARD -->
        <div class="card">
          <span class="today-amount-title">ใช้จ่ายวันนี้</span>
          <span class="today-amount" id="today-expense-amount">-฿189.00</span>
          <span class="today-count" id="today-transaction-count">3 รายการ</span>
        </div>
      </div>
      <!--Form -->
      <form class="card quick-add-card" id="quick-add-form">
        <!--BTN-Toggle -->
        <div class="type-toggle">
          <button type="button" class="toggle-btn active" id="btn-type-expense">รายจ่าย</button>
          <button type="button" class="toggle-btn" id="btn-type-income">รายรับ</button>
        </div>
        <div class="amount-input-group">
          <span class="currency-symbol">฿</span>
          <input class="amount-input" id="amount-input" type="number" placeholder="0.00">
        </div>
        <!--Grid-Card-Category -->
        <div class="category-grid">
        </div>
        <!-- Note -->
        <input class="note-input" id="note-input" type="text" placeholder="โน้ต เช่น กาแฟ">
        <!-- Save -->
        <button type="submit" class="submit-btn" id="submit-btn">+ บันทึกรายการ</button>
        <!-- Time -->
        <time class="timestamp-hint" id="form-timestamp">บันทึกวันและเวลาให้อัตโนมัติ·วันนี้ 14:32</time>
      </form>
    </section>
    <!-- PAGE2 -->
    <section id="view-transactions"></section>
    <!-- PAGE3 -->
    <section id="view-reports"></section>
    <!-- PAGE4 -->
    <section id="view-settings"></section>
  </main>

  <!-- NAV-BAR -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <i data-lucide="house"></i><span class="nav-title overview">ภาพรวม</span>
    </button>
    <button class="nav-item">
      <i data-lucide="list"></i><span class="nav-title list">รายการ</span>
    </button>
    <button class="nav-item">
      <i data-lucide="bar-chart-2"></i><span class="nav-title report">รายงาน</span>
    </button>
    <button class="nav-item">
      <i data-lucide="settings-2"></i><span class="nav-title setting">ตั้งค่า</span>
    </button>
  </nav>


  <script type="module" src="/src/main.ts"></script>
</body>

</html>
